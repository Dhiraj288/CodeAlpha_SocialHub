{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SocialHub</title>

    <link rel="stylesheet"
          href="{% static 'social/style.css' %}">

    <script src="{% static 'social/script.js' %}" defer></script>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            SocialHub
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

            <button
                type="button"
                id="theme-toggle"
                class="theme-toggle"
                aria-label="Toggle dark mode">
                🌙
            </button>

        </div>

    </nav>


    <!-- LOGIN -->

    <main class="auth-container">

        <div class="auth-box">

            <h2>
                Welcome Back
            </h2>

            <p>
                Login to continue to SocialHub.
            </p>


            <!-- MESSAGES -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{% url 'login' %}">

                {% csrf_token %}


                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>


                <button
                    type="submit"
                    class="btn">

                    Login

                </button>

            </form>


            <!-- REGISTER LINK -->

            <div class="auth-link">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        SocialHub • Developed by
        <strong>Dhiraj Verma</strong>

    </footer>

</body>

</html>
